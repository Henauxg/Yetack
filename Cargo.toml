[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"

[workspace.dependencies]
claude_protocol = { path = "crates/claude_protocol" }
cockpit_protocol = { path = "crates/cockpit_protocol" }
cockpit_client = { path = "crates/cockpit_client" }
cockpit_daemon = { path = "crates/cockpit_daemon" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The standard's panic lints (docs/standards/rust/implementation.md, "Panics").
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"
mod_module_files = "deny"
