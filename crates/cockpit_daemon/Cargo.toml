[package]
name = "cockpit_daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The two binaries serve the integration tests only: a fake `claude`, and a daemon in its own
# process, since the peer check refuses a client inside the daemon's process. The product's
# binary is `yetack`, in the `yetack` crate.
[[bin]]
name = "fake-claude"
path = "src/bin/fake_claude.rs"
test = false

[[bin]]
name = "test-serve"
path = "src/bin/test_serve.rs"
test = false

[dependencies]
base64 = "0.22.1"
claude_protocol.workspace = true
cockpit_protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "fs", "param", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
cockpit_client.workspace = true
tempfile.workspace = true

[lints]
workspace = true
