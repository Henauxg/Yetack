[package]
name = "cockpit_desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Watch and steer Claude Code agents, on this computer or on a server"

[[bin]]
name = "yetack-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
cockpit_client.workspace = true
cockpit_daemon.workspace = true
cockpit_protocol.workspace = true
dioxus = { version = "0.7.10", default-features = false, features = ["desktop", "launch", "lib"] }
futures-util = "0.3.31"
# Reads the size of an image a message shows, with the formats dioxus-desktop already builds.
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# D-Bus on the app's tokio runtime: the default backend starts a thread per notification.
notify-rust = { version = "4.18.2", default-features = false, features = ["z-with-tokio"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
# The system's folder picker, with the backend Dioxus already builds it with.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
similar = { version = "3.2.1", features = ["inline"] }
strum.workspace = true
# A private folder for the copy of a server's web page, which the browser opens.
tempfile.workspace = true
# The pure Rust regex engine: no C library to build.
syntect = { version = "5.3.0", default-features = false, features = ["regex-fancy"] }
thiserror.workspace = true
tokio.workspace = true
toml = "1.2.0"
# Writes the daemon the user picks into the config, keeping the file's comments.
toml_edit = "0.25.18"
tracing.workspace = true
tracing-subscriber.workspace = true
# Syntect's syntaxes with the ones it lacks (Protobuf, TypeScript, TOML, ...), for the same
# regex engine.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# Asks GitHub for the latest release and downloads it, over the TLS that dioxus-desktop already
# brings.
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"] }
# The parser Dioxus opens links with: an address it cannot parse would open as a local file.
url = "2.5.8"
# The browser opener Dioxus uses, where the app does not run `xdg-open` itself.
webbrowser = "1.2.6"

# The web view's settings, from the binding and the version wry brings.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.1"
# Only for `static-openssl`: OpenSSL built from source and linked into the app.
openssl-sys = { version = "0.9.118", optional = true, features = ["vendored"] }

[features]
# For the release's tarball, which runs on distros whose OpenSSL is not libssl.so.3 (Arch has
# moved to OpenSSL 4). The app still links the system's OpenSSL in the .deb and the .rpm, whose
# package managers check it.
static-openssl = ["dep:openssl-sys"]

# Waits for the app that started an updated one to end.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints]
workspace = true

# The Linux release's .deb, built by `just release` (docs/releasing.md).
[package.metadata.deb]
name = "yetack"
maintainer = "Henauxg <Henauxg@users.noreply.github.com>"
copyright = "Yetack contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Yet another agents cockpit. Run Claude Code agents on this computer or on a server, and \
watch and steer them from a desktop app: their conversations, tool calls, approvals, \
questions and plans."""
section = "devel"
priority = "optional"
revision = ""
depends = "$auto"
# The app shows emoji in agent titles, which a system without an emoji font draws as boxes.
recommends = "fonts-noto-color-emoji"
assets = [
    ["target/release/yetack-desktop", "usr/bin/", "755"],
    # The static daemon, which contrib/release/build.sh puts there first.
    ["../../dist/yetack", "usr/bin/", "755"],
    # The static daemon for ARM servers, which the app sends them.
    ["../../dist/yetack-aarch64-linux", "usr/lib/yetack/", "755"],
    ["../../contrib/yetack-desktop.desktop", "usr/share/applications/", "644"],
    ["assets/yetack.svg", "usr/share/icons/hicolor/scalable/apps/yetack.svg", "644"],
    ["assets/yetack-256.png", "usr/share/icons/hicolor/256x256/apps/yetack.png", "644"],
]

# The .deb's files with libxdo.so.3, for Fedora and openSUSE.
[package.metadata.generate-rpm]
name = "yetack"
summary = "Watch and steer Claude Code agents"
license = "MPL-2.0"
release = "1"
# The automatic requirements name every library the build machine loads under these, with
# Ubuntu's version numbers (libicu*.so.70), which Fedora does not have.
auto-req = "no"
# contrib/release/build.sh puts the files of dist/ there first: the app with its RUNPATH set to
# /usr/lib/yetack, Ubuntu 22.04's libxdo.so.3, and the static daemons for x86_64 and ARM servers.
assets = [
    { source = "../../dist/rpm/yetack-desktop", dest = "/usr/bin/yetack-desktop", mode = "755" },
    { source = "../../dist/rpm/libxdo.so.3", dest = "/usr/lib/yetack/libxdo.so.3", mode = "644" },
    { source = "../../dist/yetack", dest = "/usr/bin/yetack", mode = "755" },
    { source = "../../dist/yetack-aarch64-linux", dest = "/usr/lib/yetack/yetack-aarch64-linux", mode = "755" },
    { source = "../../contrib/yetack-desktop.desktop", dest = "/usr/share/applications/yetack-desktop.desktop", mode = "644" },
    { source = "assets/yetack.svg", dest = "/usr/share/icons/hicolor/scalable/apps/yetack.svg", mode = "644" },
    { source = "assets/yetack-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/yetack.png", mode = "644" },
]

# The libraries the app and its libxdo link (readelf -d), which dnf and zypper resolve to the
# distro's packages. The .rpm carries libxdo.so.3, because Fedora 45 and openSUSE Tumbleweed have
# only libxdo.so.4. glibc must be at least Ubuntu 22.04's, which builds the app.
[package.metadata.generate-rpm.requires]
"libc.so.6(GLIBC_2.35)(64bit)" = "*"
"libwebkit2gtk-4.1.so.0()(64bit)" = "*"
"libjavascriptcoregtk-4.1.so.0()(64bit)" = "*"
"libsoup-3.0.so.0()(64bit)" = "*"
"libgtk-3.so.0()(64bit)" = "*"
"libgdk-3.so.0()(64bit)" = "*"
"libgdk_pixbuf-2.0.so.0()(64bit)" = "*"
"libcairo.so.2()(64bit)" = "*"
"libgio-2.0.so.0()(64bit)" = "*"
"libgobject-2.0.so.0()(64bit)" = "*"
"libglib-2.0.so.0()(64bit)" = "*"
"libssl.so.3()(64bit)" = "*"
"libcrypto.so.3()(64bit)" = "*"
"libgcc_s.so.1()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libXtst.so.6()(64bit)" = "*"
"libXinerama.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"

# The app shows emoji in agent titles, which a system without an emoji font draws as boxes.
# Fedora's package has the first name, openSUSE's the second. dnf and zypper skip a recommended
# package they do not have.
[package.metadata.generate-rpm.recommends]
google-noto-color-emoji-fonts = "*"
google-noto-coloremoji-fonts = "*"
