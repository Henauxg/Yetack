[package]
name = "cockpit_desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Watch and steer Claude Code agents, on this computer or on a server"

[[bin]]
name = "yetack-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
cockpit_client.workspace = true
cockpit_daemon.workspace = true
cockpit_protocol.workspace = true
dioxus = { version = "0.7.10", default-features = false, features = ["desktop", "launch", "lib"] }
futures-util = "0.3.31"
# D-Bus on the app's tokio runtime: the default backend starts a thread per notification.
notify-rust = { version = "4.18.2", default-features = false, features = ["z-with-tokio"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
# The system's folder picker, with the backend Dioxus already builds it with.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
similar = { version = "3.2.1", features = ["inline"] }
strum.workspace = true
# The pure Rust regex engine: no C library to build.
syntect = { version = "5.3.0", default-features = false, features = ["regex-fancy"] }
thiserror.workspace = true
tokio.workspace = true
toml = "1.2.0"
# Writes the daemon the user picks into the config, keeping the file's comments.
toml_edit = "0.25.18"
tracing.workspace = true
tracing-subscriber.workspace = true
# Syntect's syntaxes with the ones it lacks (Protobuf, TypeScript, TOML, ...), for the same
# regex engine.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# The parser Dioxus opens links with: an address it cannot parse would open as a local file.
url = "2.5.8"
# The browser opener Dioxus uses, where the app does not run `xdg-open` itself.
webbrowser = "1.2.6"

# The web view's settings, from the binding and the version wry brings.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# The Linux release's .deb, built by `just release` (docs/releasing.md).
[package.metadata.deb]
name = "yetack"
maintainer = "Henauxg <Henauxg@users.noreply.github.com>"
copyright = "Yetack contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Yet another agents cockpit. Run Claude Code agents on this computer or on a server, and \
watch and steer them from a desktop app: their conversations, tool calls, approvals, \
questions and plans."""
section = "devel"
priority = "optional"
revision = ""
depends = "$auto"
# The app shows emoji in agent titles, which a system without an emoji font draws as boxes.
recommends = "fonts-noto-color-emoji"
assets = [
    ["target/release/yetack-desktop", "usr/bin/", "755"],
    # The static daemon, which contrib/release/build.sh puts there first.
    ["../../dist/yetack", "usr/bin/", "755"],
    ["../../contrib/yetack-desktop.desktop", "usr/share/applications/", "644"],
    ["assets/yetack.svg", "usr/share/icons/hicolor/scalable/apps/yetack.svg", "644"],
    ["assets/yetack-256.png", "usr/share/icons/hicolor/256x256/apps/yetack.png", "644"],
]
