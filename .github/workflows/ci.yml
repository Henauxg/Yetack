# Builds, lints and tests the workspace on Linux and Windows, and keeps the Windows desktop app.
# The dev shell is Nix; CI installs the same libraries with apt and runs plain cargo.
# It runs only when started: `gh workflow run ci.yml --ref <branch>`, or from the Actions tab.

name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the WebKitGTK libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --package cockpit_desktop
      - uses: actions/upload-artifact@v4
        with:
          name: agents-cockpit-desktop-windows
          path: target/release/agents-cockpit-desktop.exe
          if-no-files-found: error
